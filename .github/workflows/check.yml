name: Checks

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: PHP-Syntax
        run: |
          php -l "Denon AVR HTTP/module.php"
          php -l "Denon AVR Telnet/module.php"
          php -l "Denon Discovery/module.php"
          php -l "Denon HTTP IO/module.php"
          php -l "Denon Splitter HTTP/module.php"
          php -l "Denon Splitter Telnet/module.php"
          php -l DenonClass.php
          php -l DenonAVR.php
          php -l MarantzAVR.php
          php -l AVRModels.php
          for f in libs/*.php; do php -l "$f"; done
          php -l tests/check_locale.php
          php -l tests/symcon_stubs.php
          php -l tests/golden_regression.php
          php -l tests/spec_check.php
          php -l tests/dim_gate.php
          php -l tests/inheritance_check.php
          php -l tests/capability_diff.php
          php -l tests/association_check.php
      - name: JSON-Validität
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 |
            xargs -0 -n1 php -r 'json_decode(file_get_contents($argv[1]), false, 512, JSON_THROW_ON_ERROR); echo $argv[1], " ok\n";' --
      - name: Übersetzungen
        run: php tests/check_locale.php
      - name: Golden-Regression
        run: php tests/golden_regression.php
      - name: Vererbungsketten
        run: php tests/inheritance_check.php
      - name: Assoziations-Vollständigkeit
        run: php tests/association_check.php
